services:
  notificacao:
    build: .
    ports:
      - "8082:8082"
    environment:
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PROTOCOL: ${MAIL_PROTOCOL}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE}
      MAIL_SSL_PORT: ${MAIL_SSL_PORT}
      MAIL_SSL_FALLBACK: ${MAIL_SSL_FALLBACK}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME}
